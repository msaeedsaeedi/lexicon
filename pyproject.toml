[project]
name = "lexicon-pipeline"
version = "0.1.2"
description = "Deterministic lexical dataset pipeline for Vocab."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.12,<3",
  "typer>=0.21,<1",
]

[project.scripts]
lexicon = "lexicon.cli:app"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexicon"]

[dependency-groups]
dev = [
  "pyright>=1.1.408,<2",
  "pytest>=9.0,<10",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
